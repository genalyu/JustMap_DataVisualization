<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC 地图数据可视化</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <span class="logo">⛏️</span>
            <h1>MC 地图数据可视化</h1>
        </div>
        <div class="header-right">
            <span id="connection-status" class="status-badge status-disconnected">
                <span class="status-dot"></span>
                <span class="status-text">连接中...</span>
            </span>
            <button id="btn-refresh" class="btn btn-sm" title="手动刷新">
                🔄 刷新
            </button>
            <label class="auto-refresh-toggle">
                <input type="checkbox" id="auto-refresh" checked />
                <span>自动刷新 (5s)</span>
            </label>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Left: Map -->
        <section class="map-section">
            <div id="map" class="map-container"></div>
            <div class="map-controls">
                <button id="btn-toggle-heatmap" class="btn btn-sm active" title="切换热力图">
                    🔥 热力图
                </button>
                <button id="btn-toggle-entities" class="btn btn-sm active" title="切换实体标记">
                    🐾 实体
                </button>
                <button id="btn-toggle-player" class="btn btn-sm active" title="切换玩家位置">
                    ⚔️ 玩家
                </button>
            </div>
        </section>

        <!-- Right: Charts -->
        <aside class="charts-section">
            <!-- Block Distribution -->
            <div class="chart-card">
                <h3 class="chart-title">📊 方块占比</h3>
                <div id="block-chart" class="chart-container"></div>
            </div>

            <!-- Biome Distribution -->
            <div class="chart-card">
                <h3 class="chart-title">🌍 群系占比</h3>
                <div id="biome-chart" class="chart-container"></div>
            </div>

            <!-- Entity Stats -->
            <div class="chart-card">
                <h3 class="chart-title">🐾 生物统计</h3>
                <div id="entity-chart" class="chart-container"></div>
            </div>
        </aside>
    </main>

    <!-- Footer Status Bar -->
    <footer class="footer">
        <div class="footer-item">
            <span class="footer-label">玩家:</span>
            <span id="player-pos" class="footer-value">--</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">维度:</span>
            <span id="player-dim" class="footer-value">--</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">已加载区块:</span>
            <span id="loaded-chunks" class="footer-value">--</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">已探索区域:</span>
            <span id="explored-regions" class="footer-value">--</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">实体数量:</span>
            <span id="entity-count" class="footer-value">--</span>
        </div>
        <div class="footer-item">
            <span class="footer-label">世界:</span>
            <span id="world-name" class="footer-value">--</span>
        </div>
    </footer>

    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>

    <!-- App Scripts -->
    <script src="js/charts.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
